[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-glen"
version = "0.1.0"
description = "Pydantic AI capability that connects an agent to Glen's shared team memory"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Scale Venture Partners" }]
keywords = ["pydantic-ai", "capability", "agents", "memory", "glen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic-ai-slim>=2.9.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/scale-venture-partners/pydantic-ai-glen"
Issues = "https://github.com/scale-venture-partners/pydantic-ai-glen/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.3.7,<0.17",
]

[tool.setuptools.package-data]
pydantic_ai_glen = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pydantic_ai_glen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
